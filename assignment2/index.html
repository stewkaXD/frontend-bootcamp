<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Posts Manager</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<button id="open-btn">Add Post</button> <br />
			<dialog id="modal">
				<form id="add-form">
					<label for="title" class="add-form-stuff">Post title</label>
					<input type="text" name="title" id="title" />
					<p id="title-error" class="error"></p>

					<label for="body" class="add-form-stuff">Post body</label>
					<textarea name="body" id="body"></textarea>
					<p id="body-error" class="error"></p>

					<button type="submit" class="add-form-stuff" id="add-btn">
						submit
					</button>
				</form>

				<div id="final-post"></div>
				<!-- show returned id, title, body -->
			</dialog>
			<br />

			<form id="search-form" method="get">
				<label for="search">Search</label>
				<input
					type="text"
					id="search"
					name="search"
					placeholder="type here"
				/>
				<button type="submit">submit</button>
			</form>
			<br />

			<label for="sort">Sort by</label>
			<select name="sort" id="sort">
				<option value="AZ">A → Z</option>
				<option value="ZA">Z → A</option>
				<option value="idAsc">ID Ascending</option>
				<option value="idDesc">ID Descending</option>
			</select>

			<section>
				<ol id="posts-list"></ol>

				<nav>
					<button id="prev-btn">← prev</button>
					<button id="next-btn">next →</button>
				</nav>
			</section>
		</main>
		<script src="script.js"></script>
	</body>
</html>
